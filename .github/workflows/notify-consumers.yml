name: publish-skill-manifest-and-notify-consumers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable v<version> tag to verify and notify
        required: true
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve immutable release ref
        id: release
        env:
          EVENT_REF: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          release_ref="${EVENT_REF:-${INPUT_REF:-}}"
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be an immutable v<semver> tag"
            exit 1
          fi
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.release_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a published immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_ref="${{ steps.release.outputs.release_ref }}"
          release="$(gh release view "$release_ref" \
            --json tagName,isDraft,isPrerelease,isImmutable)"
          test "$(jq -r .tagName <<<"$release")" = "$release_ref"
          test "$(jq -r .isDraft <<<"$release")" = "false"
          test "$(jq -r .isPrerelease <<<"$release")" = "false"
          test "$(jq -r .isImmutable <<<"$release")" = "true"
      - name: Reproduce and verify the published release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.release.outputs.release_ref }}" \
            --pattern jianying-skills.manifest.json \
            --dir "$RUNNER_TEMP/published"
          gh release verify-asset "${{ steps.release.outputs.release_ref }}" \
            "$RUNNER_TEMP/published/jianying-skills.manifest.json"
          python3 scripts/skill_manifest.py release \
            --ref "${{ steps.release.outputs.release_ref }}" \
            --remote origin \
            --output "$RUNNER_TEMP/reproduced.manifest.json"
          cmp \
            "$RUNNER_TEMP/published/jianying-skills.manifest.json" \
            "$RUNNER_TEMP/reproduced.manifest.json"
      - name: Notify consumer repositories
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SKILLS_SYNC_TOKEN not configured; skipping consumer dispatch"
            exit 0
          fi
          release_ref="${{ steps.release.outputs.release_ref }}"
          sha="$(git rev-parse HEAD)"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/published/jianying-skills.manifest.json" | cut -d ' ' -f 1)"
          for repo in \
            full-aigc-plugins/jianying-edit-plugin ; do
            gh api "repos/${repo}/dispatches" \
              -f event_type=skills-updated \
              -F "client_payload[package]=jianying-skills" \
              -F "client_payload[release_ref]=${release_ref}" \
              -F "client_payload[sha]=${sha}" \
              -F "client_payload[manifest_sha256]=${manifest_sha256}"
            echo "dispatched ${release_ref} to ${repo} at ${sha}"
          done
