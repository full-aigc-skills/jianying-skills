name: release-skills

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate package, tests and canonical release candidate manifest
        run: |
          python3 scripts/lint_skills.py
          python3 -m unittest discover -s tests -v
          python3 scripts/skill_manifest.py check
      - name: Generate the immutable release manifest before publication
        run: |
          python3 scripts/skill_manifest.py release \
            --ref "$GITHUB_REF_NAME" \
            --remote origin \
            --output "$RUNNER_TEMP/jianying-skills.manifest.json"
      - name: Checkout pinned TRACE evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: full-stack-skills/agent-skills
          ref: 91cd3e8e2aafd73d73fc037ce75dee7b6b663ffb
          path: .trace-evaluator
          persist-credentials: false
      - name: Enforce TRACE score floor
        run: |
          python3 scripts/trace_gate.py \
            --evaluator .trace-evaluator/skills/skill-trace-evaluation/scripts/trace_evaluate.py \
            --threshold 4.5
      - name: Publish manifest through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/jianying-skills.manifest.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          immutable="$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)"
          test "$immutable" = "true"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh release verify-asset "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/jianying-skills.manifest.json"; then
              verified=true
              break
            fi
            echo "asset attestation not visible yet (attempt ${attempt}/6)"
            sleep 5
          done
          test "$verified" = "true"
      - name: Notify consumer repositories
        env:
          GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SKILLS_SYNC_TOKEN not configured; skipping consumer dispatch"
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          gh api repos/full-aigc-plugins/jianying-edit-plugin/dispatches \
            -f event_type=skills-updated \
            -F "client_payload[package]=jianying-skills" \
            -F "client_payload[release_ref]=${GITHUB_REF_NAME}" \
            -F "client_payload[sha]=${sha}"
